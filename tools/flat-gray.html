<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat Gray Test</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		overflow: hidden;
		background: rgb(16, 16, 16);
		cursor: none;
	}
	#label {
		position: fixed;
		left: 16px;
		bottom: 16px;
		font: 14px/1.5 system-ui, sans-serif;
		color: #888;
		background: #000;
		padding: 8px 12px;
		transition: opacity 0.4s;
	}
	#label.hidden {
		opacity: 0;
	}
</style>
</head>
<body>
<div id="label"></div>
<script>
	// A flat field has nothing to band or dither, so any grain left on screen comes from the panel.
	let level = 16;
	let hideTimer;
	const label = document.getElementById('label');

	function show() {
		const hex = level.toString(16).padStart(2, '0');
		document.body.style.background = `rgb(${level}, ${level}, ${level})`;
		label.textContent = `RGB ${level}, ${level}, ${level}  (#${hex}${hex}${hex})   ` +
			'Up/Down: ±1   PgUp/PgDn: ±8   1-5: presets 4, 8, 16, 32, 64   F: fullscreen   label hides in 2 s';
		label.classList.remove('hidden');
		clearTimeout(hideTimer);
		hideTimer = setTimeout(() => label.classList.add('hidden'), 2000);
	}

	const presets = {'1': 4, '2': 8, '3': 16, '4': 32, '5': 64};
	document.addEventListener('keydown', event => {
		if (event.key === 'ArrowUp') level += 1;
		else if (event.key === 'ArrowDown') level -= 1;
		else if (event.key === 'PageUp') level += 8;
		else if (event.key === 'PageDown') level -= 8;
		else if (presets[event.key]) level = presets[event.key];
		else if (event.key === 'f' || event.key === 'F') {
			if (document.fullscreenElement) document.exitFullscreen();
			else document.documentElement.requestFullscreen();
			return;
		} else return;
		level = Math.max(0, Math.min(255, level));
		event.preventDefault();
		show();
	});
	show();
</script>
</body>
</html>
